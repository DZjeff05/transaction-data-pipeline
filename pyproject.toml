[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-pipeline"
version = "0.1.0"
description = "Pipeline CI de traitement de transactions financières — niveau 1"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
transaction-pipeline = "transaction_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
