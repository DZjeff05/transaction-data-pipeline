name: CD — déploiement EC2

on:
  workflow_run:
    workflows: ["CI — niveaux 1 et 2"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ec2-deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Déployer la stack sur la VM
        run: sudo docker compose --env-file /opt/transaction-pipeline/.env.prod -f docker-compose.prod.yml up -d --build
      - name: Vérifier les services
        run: sudo docker compose --env-file /opt/transaction-pipeline/.env.prod -f docker-compose.prod.yml ps
