name: CI — niveaux 1 et 2

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transactions
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d transactions"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/transactions
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pipeline-access
      S3_SECRET_KEY: pipeline-secret-local
      S3_BUCKET: transactions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Démarrer RustFS
        run: docker compose up -d rustfs
      - name: Générer les CSV, les envoyer dans RustFS et exécuter la pipeline
        run: transaction-pipeline --generate --storage s3 --input-dir data/ci
      - run: pytest -q
      - name: Conserver les CSV de transactions générés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-csv-${{ github.run_id }}
          path: data/ci/*.csv
          if-no-files-found: warn
