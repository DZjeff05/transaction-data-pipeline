services:
  rustfs-permissions:
    image: alpine:3.20
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.5
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: pipeline-access
      RUSTFS_SECRET_KEY: pipeline-secret-local
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  rustfs_data:
