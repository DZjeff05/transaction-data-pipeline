name: transaction-pipeline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans le fichier d'environnement}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  rustfs-permissions:
    image: alpine:3.20
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.5
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Définis RUSTFS_ACCESS_KEY dans le fichier d'environnement}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Définis RUSTFS_SECRET_KEY dans le fichier d'environnement}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-transactions}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-transactions}
      POLL_SECONDS: ${POLL_SECONDS:-60}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "Recherche de nouveaux CSV dans RustFS..."
          transaction-pipeline --storage s3 --input-dir /app/incoming || echo "Échec du cycle ; nouvel essai au prochain passage."
          sleep "$$POLL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  rustfs_data:

networks:
  backend:
    driver: bridge
